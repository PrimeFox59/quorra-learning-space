{% extends "base.html" %}

{% block title %}Login Stasiun Ruang Angkasa - Quorra Space{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-6 space-y-6">
    <!-- Header Title -->
    <div class="text-center">
        <div class="inline-flex p-3 rounded-2xl bg-sky-500/10 border border-sky-500/30 mb-2 shadow-lg shadow-sky-500/20">
            <i class="bi bi-rocket-takeoff text-3xl sm:text-4xl text-cyan-400"></i>
        </div>
        <h1 class="text-2xl sm:text-3xl font-black text-white font-heading tracking-wide">Pintu Masuk Stasiun</h1>
        <p class="text-slate-400 text-xs sm:text-sm mt-1">Masuk untuk mengakses sistem pembelajaran ruang angkasa</p>
    </div>

    <!-- Login / Register Card -->
    <div class="glass-card p-6 md:p-8 border border-slate-800">
        <!-- Toggle Tabs -->
        <div class="flex border-b border-slate-800 mb-6 font-heading text-sm" id="authTabs">
            <button onclick="switchTab('loginTab')" id="loginTabBtn" class="flex-1 pb-3 text-center font-bold text-cyan-400 border-b-2 border-cyan-400 transition-all flex items-center justify-center gap-1.5">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </button>
            <button onclick="switchTab('registerTab')" id="registerTabBtn" class="flex-1 pb-3 text-center font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition-all flex items-center justify-center gap-1.5">
                <i class="bi bi-person-plus"></i> Register
            </button>
        </div>

        <!-- Login Form -->
        <form id="loginTab" action="{{ url_for('auth.login') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-[10px] font-mono uppercase text-slate-300 mb-1 font-bold">Username / Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" name="login_input" required placeholder="admin / guru@space.com / murid@space.com"
                        class="w-full pl-9 pr-4 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all text-xs font-mono">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-mono uppercase text-slate-300 mb-1 font-bold">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                        <i class="bi bi-key"></i>
                    </span>
                    <input type="password" name="password" required placeholder="••••••••"
                        class="w-full pl-9 pr-4 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all text-xs font-mono">
                </div>
            </div>

            <div class="flex items-center justify-between text-xs font-mono">
                <label class="flex items-center gap-2 cursor-pointer text-slate-400">
                    <input type="checkbox" name="remember" class="rounded bg-slate-900 border-slate-700 text-cyan-400 focus:ring-0">
                    <span>Ingat Saya</span>
                </label>
            </div>

            <button type="submit" class="w-full py-2.5 rounded-xl btn-space-cyan font-bold text-xs font-heading flex items-center justify-center gap-2 shadow-lg">
                <i class="bi bi-shield-lock-fill"></i> Masuk Stasiun
            </button>
        </form>

        <!-- Register Form (Hidden by default) -->
        <form id="registerTab" action="{{ url_for('auth.register') }}" method="POST" class="space-y-4 hidden">
            <div>
                <label class="block text-[10px] font-mono uppercase text-slate-300 mb-1 font-bold">Username Astronot</label>
                <input type="text" name="username" required placeholder="misal: galaxy_coder"
                    class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-400 transition-all text-xs font-mono">
            </div>

            <div>
                <label class="block text-[10px] font-mono uppercase text-slate-300 mb-1 font-bold">Email Stasiun</label>
                <input type="email" name="email" required placeholder="astronot@space.com"
                    class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-400 transition-all text-xs font-mono">
            </div>

            <div>
                <label class="block text-[10px] font-mono uppercase text-slate-300 mb-1 font-bold">Role Akun</label>
                <select name="role" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-slate-100 focus:outline-none focus:border-cyan-400 transition-all text-xs font-mono">
                    <option value="MURID">Murid (Siswa Astronot)</option>
                    <option value="GURU">Guru (Instruktur Stasiun)</option>
                </select>
            </div>

            <div>
                <label class="block text-[10px] font-mono uppercase text-slate-300 mb-1 font-bold">Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                    class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-400 transition-all text-xs font-mono">
            </div>

            <button type="submit" class="w-full py-2.5 rounded-xl btn-space-purple font-bold text-xs font-heading flex items-center justify-center gap-2 shadow-lg">
                <i class="bi bi-person-check-fill"></i> Daftarkan Akun Baru
            </button>
        </form>

        <!-- Default Accounts Quick Login Widget -->
        <div class="mt-6 pt-5 border-t border-slate-800/80">
            <p class="text-[11px] font-mono text-cyan-400 font-bold mb-2 flex items-center gap-1">
                <i class="bi bi-lightning-fill"></i> QUICK LOGIN DEMO:
            </p>
            <div class="grid grid-cols-3 gap-2 text-[10px] font-mono">
                <button type="button" onclick="fillLogin('admin', 'admin123')" class="p-2 rounded-lg bg-purple-950/40 border border-purple-500/30 text-purple-300 hover:border-purple-400 text-left transition-colors">
                    <span class="block font-bold">Superuser</span>
                    <span class="text-[9px] text-slate-400 block truncate">admin</span>
                </button>
                <button type="button" onclick="fillLogin('guru@space.com', 'guru123')" class="p-2 rounded-lg bg-emerald-950/40 border border-emerald-500/30 text-emerald-300 hover:border-emerald-400 text-left transition-colors">
                    <span class="block font-bold">Guru</span>
                    <span class="text-[9px] text-slate-400 block truncate">guru@space.com</span>
                </button>
                <button type="button" onclick="fillLogin('murid@space.com', 'murid123')" class="p-2 rounded-lg bg-sky-950/40 border border-sky-500/30 text-sky-300 hover:border-sky-400 text-left transition-colors">
                    <span class="block font-bold">Murid</span>
                    <span class="text-[9px] text-slate-400 block truncate">murid@space.com</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function switchTab(tabId) {
    document.getElementById('loginTab').classList.add('hidden');
    document.getElementById('registerTab').classList.add('hidden');
    document.getElementById(tabId).classList.remove('hidden');

    document.getElementById('loginTabBtn').className = 'flex-1 pb-3 text-center font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition-all flex items-center justify-center gap-1.5';
    document.getElementById('registerTabBtn').className = 'flex-1 pb-3 text-center font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition-all flex items-center justify-center gap-1.5';

    if(tabId === 'loginTab') {
        document.getElementById('loginTabBtn').className = 'flex-1 pb-3 text-center font-bold text-cyan-400 border-b-2 border-cyan-400 transition-all flex items-center justify-center gap-1.5';
    } else {
        document.getElementById('registerTabBtn').className = 'flex-1 pb-3 text-center font-bold text-purple-400 border-b-2 border-purple-400 transition-all flex items-center justify-center gap-1.5';
    }
}

function fillLogin(user, pass) {
    switchTab('loginTab');
    document.querySelector('input[name="login_input"]').value = user;
    document.querySelector('input[name="password"]').value = pass;
}
</script>
{% endblock %}
